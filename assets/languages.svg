<svg xmlns="http://www.w3.org/2000/svg" width="300" height="283" viewBox="0 0 300 283" fill="none" role="img" aria-labelledby="title">
<title id="title">Most Used Languages</title>
<style>
  svg { --t: #1f2328; --x: #59636e; --b: #d1d9e0; --k0: #a3130b; --k1: #b8180e; --k2: #c92012; --k3: #d92b18; } @media (prefers-color-scheme: dark) { svg { --t: #f0f6fc; --x: #9198a1; --b: #3d444d; } }
